name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q --cov=vessel_eta --cov-report=term --cov-fail-under=80

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t vessel-eta .
      - name: smoke test the API
        run: |
          docker run -d -p 8000:8000 --name api vessel-eta
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          curl -sf -X POST localhost:8000/v1/eta -H 'content-type: application/json' \
            -d @examples/request.json | tee /tmp/eta.json
          python3 -c "import json; r = json.load(open('/tmp/eta.json')); q = r['eta_minutes']; assert 0 <= q['p10'] <= q['p50'] <= q['p90']"
      - if: failure()
        run: docker logs api
