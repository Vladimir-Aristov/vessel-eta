[project]
name = "vessel-eta"
version = "0.1.0"
description = "Probabilistic vessel ETA for the ports of Los Angeles and Long Beach from NOAA AIS data"
readme = "README.md"
license = "MIT"
authors = [{ name = "Vladimir Aristov" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "prometheus-client>=0.26.0",
    "pyarrow>=26.0.0",
    "pypdf>=6.21.3",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "shapely>=2.2.0",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
vessel-eta = "vessel_eta.cli:app"

[project.optional-dependencies]
nn = [
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that hit the real NOAA servers (deselect with -m 'not network')"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # long literal AIS rows read better unwrapped

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true   # polars/lightgbm/shapely ship partial or no stubs
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
