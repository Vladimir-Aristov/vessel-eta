name: deploy-space

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "configs/**"
      - "artifacts/**"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/deploy_space.py"
      - ".github/workflows/space.yml"
  workflow_dispatch:

concurrency:
  group: deploy-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: mirror to the Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run --no-project --with huggingface_hub python scripts/deploy_space.py
